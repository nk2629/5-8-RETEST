<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5학년 영어 철자 재시험</title>
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#64748b; --line:#d9e1ec; --blue:#2457d6; --blue2:#1743ae; --soft:#f4f7fb; --ok:#087443; --warn:#a54216; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:#eef2f7; color:var(--ink); font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; display:grid; place-items:center; padding:24px; }
    .app { width:min(720px,100%); background:#fff; border:1px solid var(--line); border-radius:18px; box-shadow:0 14px 40px rgba(28,42,69,.10); overflow:hidden; }
    header { padding:24px 28px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:16px; align-items:center; }
    h1 { font-size:clamp(22px,4vw,31px); margin:0; letter-spacing:-.04em; }
    main { padding:34px 28px 30px; }
    .meta { display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-weight:700; margin-bottom:26px; }
    .prompt { text-align:center; font-size:clamp(30px,8vw,52px); font-weight:900; margin:24px 0 28px; letter-spacing:-.05em; }
    .notice { background:#fff8e8; border:1px solid #f3d58b; color:#714a00; border-radius:10px; padding:12px 14px; text-align:center; font-size:15px; font-weight:700; margin-bottom:22px; }
    input { width:100%; height:66px; border:2px solid #aebbd0; border-radius:12px; padding:0 18px; font-size:26px; text-align:center; outline:none; }
    input:focus { border-color:var(--blue); box-shadow:0 0 0 4px rgba(36,87,214,.12); }
    button { border:0; border-radius:11px; padding:15px 20px; font-size:18px; font-weight:900; cursor:pointer; }
    .primary { width:100%; margin-top:14px; background:var(--blue); color:white; }
    .primary:hover { background:var(--blue2); }
    .secondary { background:white; color:var(--blue); border:2px solid var(--blue); }
    .quiet { background:#edf1f7; color:#4b5b73; }
    .actions { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:24px; }
    .result { text-align:center; }
    .result h2 { font-size:clamp(30px,7vw,46px); margin:8px 0 14px; }
    .result p { color:var(--muted); font-size:18px; line-height:1.6; }
    .score { font-size:64px; font-weight:1000; color:var(--blue); margin:12px 0 22px; }
    .status { margin:24px auto; max-width:470px; border:1px solid var(--line); border-radius:12px; overflow:hidden; text-align:left; }
    .status div { display:flex; justify-content:space-between; gap:16px; padding:14px 16px; background:#fff; }
    .status div + div { border-top:1px solid var(--line); }
    .done { color:var(--ok); font-weight:900; }
    .notdone { color:var(--warn); font-weight:900; }
    .wrong { color:var(--warn); font-weight:900; min-height:28px; text-align:center; margin-top:12px; }
    .hidden { display:none !important; }
    footer { padding:15px 24px; background:var(--soft); color:var(--muted); text-align:center; font-size:13px; }
    @media (max-width:520px) { body{padding:0;background:#fff}.app{min-height:100vh;border:0;border-radius:0;box-shadow:none}header,main{padding-left:20px;padding-right:20px}.meta{font-size:14px}.actions button{width:100%} }
  </style>
</head>
<body>
  <section class="app" aria-live="polite">
    <header>
      <h1>5학년 영어 철자 재시험</h1>
      <button id="resetTop" class="quiet" type="button">처음부터</button>
    </header>
    <main>
      <section id="startScreen" class="result">
        <h2>철자 완전 정복</h2>
        <p><strong>퍼펙트 챌린지는 기본 도전 완료 후 참여할 수 있습니다.</strong></p>
        <p>뜻을 보고 알맞은 영어 철자를 입력하세요.<br>틀린 문제는 모두 맞힐 때까지 다시 나옵니다.</p>
        <div class="notice">띄어쓰기가 있는 단어는 띄어쓰기까지 정확하게 입력하세요.</div>
        <button id="startBtn" class="primary" type="button">시작</button>
      </section>

      <section id="quizScreen" class="hidden">
        <div class="meta"><span id="roundLabel"></span><span id="progressLabel"></span></div>
        <div class="notice">띄어쓰기가 있는 단어는 띄어쓰기까지 정확하게 입력하세요.</div>
        <div id="prompt" class="prompt"></div>
        <label for="answer" class="hidden">영어 철자 입력</label>
        <input id="answer" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="영어 철자 입력">
        <button id="submitBtn" class="primary" type="button">확인</button>
        <div id="feedback" class="wrong"></div>
      </section>

      <section id="resultScreen" class="result hidden">
        <h2 id="resultTitle"></h2>
        <div id="score" class="score"></div>
        <p id="resultMessage"></p>
        <div id="statusBox" class="status"></div>
        <div id="resultActions" class="actions"></div>
      </section>
    </main>
    <footer>답안은 이 기기에만 저장되며 외부로 전송되지 않습니다.</footer>
  </section>

  <script id="game-core">
  (() => {
    const QUESTIONS = Object.freeze([
      { id: 1, prompt: '비프 스테이크', answer: 'beef steak' },
      { id: 2, prompt: '고르다', answer: 'choose' },
      { id: 3, prompt: '피쉬 앤 칩스', answer: 'fish and chips' },
      { id: 4, prompt: '또는', answer: 'or' },
      { id: 5, prompt: '스파게티', answer: 'spaghetti' },
      { id: 6, prompt: '맛있는', answer: 'tasty' },
      { id: 7, prompt: '맛이 신', answer: 'sour' },
      { id: 8, prompt: '바삭한', answer: 'crispy' },
      { id: 9, prompt: '볶음밥', answer: 'fried rice' },
      { id: 10, prompt: '도넛', answer: 'doughnut' }
    ]);
    const normalizeAnswer = value => String(value ?? '').trim().toLowerCase();
    const isCorrect = (given, expected) => normalizeAnswer(given) === normalizeAnswer(expected);
    const nextRetryQuestions = (ids, results) => ids.filter(id => !results[id]);
    const shuffleQuestions = (items, random = Math.random) => {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    };
    const canStartPerfect = attempts => attempts < 3;
    const completionSummary = state => ({
      base: state.baseComplete ? '100점 완료' : '미완료',
      perfect: state.perfectComplete ? '완료' : '미완료',
      remaining: Math.max(0, 3 - state.perfectAttempts)
    });
    const resetState = () => ({ baseComplete:false, perfectComplete:false, perfectAttempts:0, retryRound:0, pendingIds:[] });
    window.GameCore = { QUESTIONS, normalizeAnswer, isCorrect, nextRetryQuestions, shuffleQuestions, canStartPerfect, completionSummary, resetState };
  })();
  </script>

  <script>
  (() => {
    const C = window.GameCore;
    const KEY = 'grade5SpellingRetestV1';
    const $ = id => document.getElementById(id);
    const screens = ['startScreen', 'quizScreen', 'resultScreen'];
    let state = loadState();
    let mode = 'base';
    let queue = [];
    let index = 0;
    let results = {};

    function validState(raw) {
      const base = C.resetState();
      if (!raw || typeof raw !== 'object') return base;
      return {
        lastFirstId: Number.isInteger(raw.lastFirstId) ? raw.lastFirstId : null,
        baseComplete: raw.baseComplete === true,
        perfectComplete: raw.perfectComplete === true,
        perfectAttempts: Math.min(3, Math.max(0, Number(raw.perfectAttempts) || 0)),
        retryRound: Math.max(0, Number(raw.retryRound) || 0),
        pendingIds: Array.isArray(raw.pendingIds) ? raw.pendingIds.filter(id => Number.isInteger(id) && id >= 1 && id <= 10) : []
      };
    }
    function loadState() {
      try { return validState(JSON.parse(localStorage.getItem(KEY))); }
      catch { return C.resetState(); }
    }
    function saveState() {
      try { localStorage.setItem(KEY, JSON.stringify(state)); }
      catch { document.querySelector('footer').textContent = '저장이 제한되어 현재 화면에서만 진행됩니다. 창을 닫으면 기록이 사라질 수 있습니다.'; }
    }
    function show(id) { screens.forEach(x => $(x).classList.toggle('hidden', x !== id)); }
    function byId(id) { return C.QUESTIONS.find(q => q.id === id); }

    function beginBase() {
      mode = 'base';
      if (state.baseComplete) return showCompletion('기본 도전 완료');
      const ids = state.pendingIds.length ? C.shuffleQuestions(state.pendingIds) : C.QUESTIONS.map(q => q.id);
      if (!state.pendingIds.length && state.lastFirstId) {
        const mixed = C.shuffleQuestions(ids);
        if (mixed[0] === state.lastFirstId) {
          const j = 1 + Math.floor(Math.random() * (mixed.length - 1));
          [mixed[0], mixed[j]] = [mixed[j], mixed[0]];
        }
        ids.splice(0, ids.length, ...mixed);
      }
      if (!state.pendingIds.length) {
        state.lastFirstId = ids[0];
        saveState();
      }
      beginRound(ids);
    }
    function beginRetry() {
      mode = 'base';
      state.retryRound += 1;
      saveState();
      beginRound(C.shuffleQuestions(state.pendingIds));
    }
    function beginPerfect() {
      if (state.perfectComplete || !C.canStartPerfect(state.perfectAttempts)) return showCompletion('도전 결과');
      mode = 'perfect';
      state.perfectAttempts += 1;
      saveState();
      beginRound(C.shuffleQuestions(C.QUESTIONS.map(q => q.id)));
    }
    function beginRound(ids) {
      queue = ids;
      index = 0;
      results = {};
      show('quizScreen');
      renderQuestion();
    }
    function renderQuestion() {
      const q = byId(queue[index]);
      $('roundLabel').textContent = mode === 'perfect' ? `퍼펙트 챌린지 ${state.perfectAttempts}회` : (state.retryRound ? `재도전 ${state.retryRound}회` : '첫 도전');
      $('progressLabel').textContent = `${index + 1} / ${queue.length}`;
      $('prompt').textContent = q.prompt;
      $('answer').value = '';
      $('feedback').textContent = '';
      $('answer').focus();
    }
    function submit() {
      const value = $('answer').value;
      if (!value.trim()) { $('feedback').textContent = '철자를 입력하세요.'; $('answer').focus(); return; }
      const q = byId(queue[index]);
      results[q.id] = C.isCorrect(value, q.answer);
      index += 1;
      if (index < queue.length) renderQuestion(); else finishRound();
    }
    function finishRound() {
      const wrong = C.nextRetryQuestions(queue, results);
      const correctCount = queue.length - wrong.length;
      if (mode === 'base') {
        state.pendingIds = wrong;
        if (!wrong.length) { state.baseComplete = true; state.pendingIds = []; }
        saveState();
        if (state.baseComplete) showCompletion('100점 완료!', 100, '10개 단어를 모두 정확하게 맞혔습니다.');
        else showRetry(correctCount, queue.length, wrong.length);
      } else {
        if (!wrong.length) state.perfectComplete = true;
        saveState();
        const score = correctCount * 10;
        const message = state.perfectComplete ? '퍼펙트 챌린지까지 완료했습니다.' : (C.canStartPerfect(state.perfectAttempts) ? '전체 문제에 다시 도전할 기회가 남아 있습니다.' : '퍼펙트 챌린지 3회의 기회를 모두 사용했습니다.');
        showCompletion(state.perfectComplete ? '최종 완료!' : '퍼펙트 챌린지 결과', score, message);
      }
    }
    function statusMarkup() {
      const s = C.completionSummary(state);
      return `<div><span>기본 도전</span><strong class="${state.baseComplete?'done':'notdone'}">${s.base}</strong></div>` +
             `<div><span>퍼펙트 챌린지</span><strong class="${state.perfectComplete?'done':'notdone'}">${s.perfect}</strong></div>` +
             `<div><span>남은 기회</span><strong>${s.remaining}회</strong></div>`;
    }
    function actionButton(label, className, handler) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = label; b.className = className; b.addEventListener('click', handler); return b;
    }
    function showRetry(correct, total, wrongCount) {
      show('resultScreen');
      $('resultTitle').textContent = '이번 회차 결과';
      $('score').textContent = `${correct} / ${total}`;
      $('resultMessage').textContent = `${wrongCount}문제만 다시 나옵니다. 재도전할 때 문제 순서가 바뀝니다.`;
      $('statusBox').innerHTML = statusMarkup();
      $('resultActions').replaceChildren(actionButton('틀린 문제 재도전', 'primary', beginRetry));
    }
    function showCompletion(title, score, message) {
      show('resultScreen');
      $('resultTitle').textContent = title;
      $('score').textContent = Number.isFinite(score) ? `${score}점` : '';
      $('resultMessage').textContent = message || (state.perfectComplete ? '모든 도전을 완료했습니다.' : '기본 도전을 완료했습니다.');
      $('statusBox').innerHTML = statusMarkup();
      const actions = [];
      if (state.baseComplete && !state.perfectComplete && C.canStartPerfect(state.perfectAttempts)) actions.push(actionButton('퍼펙트 챌린지', 'secondary', beginPerfect));
      actions.push(actionButton('처음부터', 'quiet', resetAll));
      $('resultActions').replaceChildren(...actions);
    }
    function resetAll() {
      const lastFirstId = state.lastFirstId;
      try { localStorage.removeItem(KEY); } catch {}
      state = C.resetState(); mode = 'base'; queue = []; index = 0; results = {};
      state.lastFirstId = lastFirstId;
      saveState();
      show('startScreen');
    }

    $('startBtn').addEventListener('click', beginBase);
    $('submitBtn').addEventListener('click', submit);
    $('answer').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    $('resetTop').addEventListener('click', resetAll);
    if (state.baseComplete) showCompletion('이어하기');
  })();
  </script>
</body>
</html>
